name: hygiene
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner self-test
        run: tools/check-no-personal-data --self-test
      - name: No personal data
        run: tools/check-no-personal-data
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install bridge dependencies
        run: bun install --frozen-lockfile
      - name: Install attachment validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick poppler-utils
      - name: Bridge checks
        run: bun test server
